<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Event Delegation</title>
        <style>
            *{
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            }
            body{
                height: 100vh;
                width: 100%;
            }
            .parent{
                padding:2rem 1rem;
                border:1px solid rgba(0, 0, 0, 0.599);
                box-shadow: 0 0 5px rgba(0, 0, 0, 0.242);
                display: flex;
                justify-content: space-around;
            }
            .child{
                width: 150px;
                height: 150px;
                margin-top: 1rem;
                background-color: aqua;
                box-shadow: 0 0 2px rgba(0, 0, 0, 0.279);
                cursor: pointer;
                border-radius: 8px;
                text-align: center;
                line-height: 150px;
            }
 
            .apply{
                background-color: blueviolet;
                color: white;
            }
            
        </style>
    </head>
    <body>
        <div class="parent">
            <div class="child" data-number="1">Click Me</div>
            <div class="child" data-number="2">Click Me</div>
            <div class="child" data-number="3">Click Me</div>
            <div class="child" data-number="4">Click Me</div>
            <div class="child" data-number="5">Click Me</div>
        </div>
        <script src="./app.js"></script>
    </body>
</html>
