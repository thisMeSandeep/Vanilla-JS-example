<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
            color: white;
        }
        header{
            width: 100%;
            font-size: 2rem;
            background: rgb(128, 0, 128);
            text-align: center;
            padding: 20px 0;
        }
        .content-section{
            width: 100%;
            height:72vh;
            margin-top: 20px;
            background: purple;
            display: flex;
            flex-wrap: wrap;
        }
       nav{
            width:25%;
            border: 2px solid white;
        }
        main{
            width: 50%;
            border: 2px solid white;
        }
        aside{
            width: 25%;
            border: 2px solid white;
        }
        nav , main , aside{
            height: 100%;
            text-align: center;
            font-size: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        footer{
            width: 100%;
            font-size: 2rem;
            background: rgb(128, 0, 128);
            text-align: center;
            line-height: 100%;
            padding: 20px 0;
            margin-top: 20px;
        }
        @media  screen and (max-width:600px){

            nav , main , aside{
                width: 100%;
                height: auto;

            }
        }
            
        
    </style>
</head>
<body>
    <header>Header</header>
     


    <div class="content-section">

        <nav>Navbar</nav>
        <main>content</main>
        <aside>sidebar</aside>

    </div>

    <footer>Footer</footer>
</body>
</html>
